name: Refresh profile art

on:
  schedule:
    - cron: "23 1 * * *" # daily, 06:53 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content.toml", "scripts/**", "fonts/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write

concurrency:
  group: refresh-profile-art
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tooling
        run: pip install fonttools==4.62.1 brotli==1.1.0

      - name: Fetch live numbers
        env:
          # Optional PROFILE_TOKEN (read-only PAT) also counts private-repo PRs; GITHUB_TOKEN sees public data.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_data.py

      - name: Render SVGs
        run: python scripts/render.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json assets/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh profile art [skip ci]"
            git push
          fi
